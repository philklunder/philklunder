<svg xmlns="http://www.w3.org/2000/svg" width="840" height="358" viewBox="0 0 840 358" role="img" aria-label="About Philipp: intern and apprentice Application Developer EFZ in Switzerland, final year">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#BE123C"/><stop offset=".55" stop-color="#F43F5E"/><stop offset="1" stop-color="#FDA4AF"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F43F5E" stop-opacity=".75"/><stop offset=".5" stop-color="#3A1E2A"/><stop offset="1" stop-color="#FDA4AF" stop-opacity=".55"/>
