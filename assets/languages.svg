<svg xmlns="http://www.w3.org/2000/svg" width="840" height="214" viewBox="0 0 840 214" role="img" aria-label="Languages by code volume: TypeScript 53.2%, HTML 18.2%, JavaScript 8.3%, CSS 7.6%, Swift 5.3%, Other 7.3%">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#BE123C"/><stop offset=".55" stop-color="#F43F5E"/><stop offset="1" stop-color="#FDA4AF"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F43F5E" stop-opacity=".75"/><stop offset=".5" stop-color="#3A1E2A"/><stop offset="1" stop-color="#FDA4AF" stop-opacity=".55"/>
  </linearGradient>
  <clipPath id="barClip"><rect x="36" y="92" width="768" height="16" rx="8"/></clipPath>
  <linearGradient id="shineGrad"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
  .h{font:700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F5E9EE}.sub{font:13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B39BA6}
  .ln{font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F5E9EE}.pc{font:600 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#B39BA6}
  .seg{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}
  .lg{opacity:0;animation:fade .5s ease-out forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .shine{animation:shine 4s 2s ease-in-out infinite}
  @keyframes shine{0%{transform:translateX(-120px)}60%,100%{transform:translateX(840px)}}</style>
<rect x="1" y="1" width="838" height="212" rx="18" fill="#130C11" stroke="url(#edge)" stroke-width="1.5"/>

<text class="h" x="36" y="46">What I write</text>
<text class="sub" x="36" y="68">by code volume across 12 repositories · public &amp; private</text>
<g clip-path="url(#barClip)">
  <rect x="36" y="92" width="768" height="16" fill="#1E1319"/>
  <rect class="seg" x="36.0" y="92" width="406.9" height="16" fill="#F43F5E" style="animation-delay:0.20s"/><rect class="seg" x="444.9" y="92" width="138.0" height="16" fill="#FDA4AF" style="animation-delay:0.84s"/><rect class="seg" x="584.9" y="92" width="61.9" height="16" fill="#F6C177" style="animation-delay:1.06s"/><rect class="seg" x="648.7" y="92" width="56.6" height="16" fill="#C084FC" style="animation-delay:1.16s"/><rect class="seg" x="707.4" y="92" width="38.3" height="16" fill="#FB923C" style="animation-delay:1.25s"/><rect class="seg" x="747.7" y="92" width="54.3" height="16" fill="#6B4A58" style="animation-delay:1.31s"/>
  <rect class="shine" x="0" y="92" width="80" height="16" fill="url(#shineGrad)"/>
</g>
<g class="lg" style="animation-delay:0.60s"><circle cx="41" cy="142" r="5" fill="#F43F5E"/>
  <text class="ln" x="54" y="146">TypeScript</text><text class="pc" x="154" y="146">53.2%</text></g><g class="lg" style="animation-delay:0.70s"><circle cx="297" cy="142" r="5" fill="#FDA4AF"/>
  <text class="ln" x="310" y="146">HTML</text><text class="pc" x="410" y="146">18.2%</text></g><g class="lg" style="animation-delay:0.80s"><circle cx="553" cy="142" r="5" fill="#F6C177"/>
  <text class="ln" x="566" y="146">JavaScript</text><text class="pc" x="666" y="146">8.3%</text></g><g class="lg" style="animation-delay:0.90s"><circle cx="41" cy="172" r="5" fill="#C084FC"/>
  <text class="ln" x="54" y="176">CSS</text><text class="pc" x="154" y="176">7.6%</text></g><g class="lg" style="animation-delay:1.00s"><circle cx="297" cy="172" r="5" fill="#FB923C"/>
  <text class="ln" x="310" y="176">Swift</text><text class="pc" x="410" y="176">5.3%</text></g><g class="lg" style="animation-delay:1.10s"><circle cx="553" cy="172" r="5" fill="#6B4A58"/>
  <text class="ln" x="566" y="176">Other</text><text class="pc" x="666" y="176">7.3%</text></g>
</svg>