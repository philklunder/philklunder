<svg xmlns="http://www.w3.org/2000/svg" width="840" height="812" viewBox="0 0 840 812" role="img" aria-label="Journey from starting the apprenticeship in August 2023 to the final year in 2026">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#BE123C"/><stop offset=".55" stop-color="#F43F5E"/><stop offset="1" stop-color="#FDA4AF"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F43F5E" stop-opacity=".75"/><stop offset=".5" stop-color="#3A1E2A"/><stop offset="1" stop-color="#FDA4AF" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="vline" gradientUnits="userSpaceOnUse" x1="0" y1="176" x2="0" y2="698"><stop offset="0" stop-color="#BE123C"/><stop offset="1" stop-color="#F6C177"/></linearGradient></defs>
<style>
  .h{font:700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F5E9EE}.sub{font:13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B39BA6}
  .pl{font:600 12px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#F6C177}
  .pb{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.6s .2s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}
  .line{stroke-dasharray:522;stroke-dashoffset:522;animation:draw 2.2s .4s linear forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .node{opacity:0;animation:in .5s cubic-bezier(.2,.8,.2,1.4) forwards}
  .future{animation-name:inDim}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes inDim{from{opacity:0}to{opacity:.6}}
  .d{font:700 11.5px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#FDA4AF;letter-spacing:.5px}.dnow{fill:#F6C177}
  .t{font:700 14.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F5E9EE}.s{font:12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B39BA6}
  .pulse{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}</style>
<rect x="1" y="1" width="838" height="810" rx="18" fill="#130C11" stroke="url(#edge)" stroke-width="1.5"/>

<text class="h" x="36" y="46">The road so far</text>
<text class="sub" x="36" y="68">Apprenticeship · Application Developer EFZ · Aug 2023 – Summer 2027</text>
<rect x="36" y="86" width="768" height="10" rx="5" fill="#1E1319"/>
<rect class="pb" x="36" y="86" width="603.6" height="10" rx="5" fill="url(#brand)"/>
<path d="M228 84v14" stroke="#130C11" stroke-width="2"/><path d="M420 84v14" stroke="#130C11" stroke-width="2"/><path d="M612 84v14" stroke="#130C11" stroke-width="2"/>
<text class="sub" x="132" y="116" text-anchor="middle" >Year 1</text><text class="sub" x="324" y="116" text-anchor="middle" >Year 2</text><text class="sub" x="516" y="116" text-anchor="middle" >Year 3</text><text class="sub" x="708" y="116" text-anchor="middle" style="fill:#F6C177;font-weight:700">Year 4</text>
<text class="pl" x="804" y="72" text-anchor="end">79% DONE</text>
