<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-label="Journey from the start of the apprenticeship in August 2023 to the EFZ diploma in 2027">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#BE123C"/><stop offset=".55" stop-color="#F43F5E"/><stop offset="1" stop-color="#FDA4AF"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F43F5E" stop-opacity=".75"/><stop offset=".5" stop-color="#3A1E2A"/><stop offset="1" stop-color="#FDA4AF" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="hline" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#BE123C"/><stop offset="1" stop-color="#F6C177"/></linearGradient></defs>
<style>
  .h{font:700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F5E9EE}.sub{font:13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B39BA6}
  .pl{font:600 12px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#F6C177}
  .pb{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.6s .2s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}
  .line{stroke-dasharray:550;stroke-dashoffset:550;animation:draw 1.54s .5s linear forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .node{opacity:0;animation:in .5s cubic-bezier(.2,.8,.2,1.4) forwards}
  .future{animation-name:inDim}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes inDim{from{opacity:0}to{opacity:.6}}
  .d{font:700 11px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#FDA4AF;letter-spacing:.5px}.dnow{fill:#F6C177}
  .t{font:700 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F5E9EE}.s{font:12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#B39BA6}
  .pulse{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}</style>
<rect x="1" y="1" width="838" height="268" rx="18" fill="#130C11" stroke="url(#edge)" stroke-width="1.5"/>

<text class="h" x="36" y="46">The road so far</text>
<text class="sub" x="36" y="68">Apprenticeship · Application Developer EFZ · year 4 of 4</text>
<text class="pl" x="804" y="68" text-anchor="end">79% DONE</text>
<rect x="36" y="84" width="768" height="8" rx="4" fill="#1E1319"/>
<rect class="pb" x="36" y="84" width="603.6" height="8" rx="4" fill="url(#brand)"/>
<path d="M228 82v12" stroke="#130C11" stroke-width="2"/><path d="M420 82v12" stroke="#130C11" stroke-width="2"/><path d="M612 82v12" stroke="#130C11" stroke-width="2"/>
<path d="M90 180H750" stroke="#3A1E2A" stroke-width="3" stroke-linecap="round"/>
<path class="line" d="M90 180H640" stroke="url(#hline)" stroke-width="3" stroke-linecap="round"/>
<g class="node" style="animation-delay:0.50s">
  
  <circle cx="90" cy="180" r="9" fill="#130C11" stroke="#F43F5E" stroke-width="3" />
  <circle cx="90" cy="180" r="3.5" fill="#F5E9EE"/>
  <text class="d" x="90" y="158" text-anchor="middle">Aug 2023</text>
  <text class="t" x="90" y="214" text-anchor="middle">Apprenticeship</text>
  <text class="s" x="90" y="232" text-anchor="middle">begins</text></g>
<g class="node" style="animation-delay:0.72s">
  
  <circle cx="200" cy="180" r="9" fill="#130C11" stroke="#F43F5E" stroke-width="3" />
  <circle cx="200" cy="180" r="3.5" fill="#F5E9EE"/>
  <text class="d" x="200" y="158" text-anchor="middle">Feb 2025</text>
  <text class="t" x="200" y="214" text-anchor="middle">First repos</text>
  <text class="s" x="200" y="232" text-anchor="middle">C# &amp; the web</text></g>
<g class="node" style="animation-delay:0.94s">
  
  <circle cx="310" cy="180" r="9" fill="#130C11" stroke="#F43F5E" stroke-width="3" />
  <circle cx="310" cy="180" r="3.5" fill="#F5E9EE"/>
  <text class="d" x="310" y="158" text-anchor="middle">Dec 2025</text>
  <text class="t" x="310" y="214" text-anchor="middle">Exam project</text>
  <text class="s" x="310" y="232" text-anchor="middle">secure C# app</text></g>
<g class="node" style="animation-delay:1.16s">
  
  <circle cx="420" cy="180" r="9" fill="#130C11" stroke="#F43F5E" stroke-width="3" />
  <circle cx="420" cy="180" r="3.5" fill="#F5E9EE"/>
  <text class="d" x="420" y="158" text-anchor="middle">Mar 2026</text>
  <text class="t" x="420" y="214" text-anchor="middle">Going mobile</text>
  <text class="s" x="420" y="232" text-anchor="middle">Angular + Ionic</text></g>
<g class="node" style="animation-delay:1.38s">
  
  <circle cx="530" cy="180" r="9" fill="#130C11" stroke="#F43F5E" stroke-width="3" />
  <circle cx="530" cy="180" r="3.5" fill="#F5E9EE"/>
  <text class="d" x="530" y="158" text-anchor="middle">Jun 2026</text>
  <text class="t" x="530" y="214" text-anchor="middle">cram</text>
  <text class="s" x="530" y="232" text-anchor="middle">iOS + FastAPI</text></g>
<g class="node" style="animation-delay:1.60s">
  <circle class="pulse" cx="640" cy="180" r="9" fill="#F6C177"/>
  <circle cx="640" cy="180" r="9" fill="#130C11" stroke="#F6C177" stroke-width="3" />
  <circle cx="640" cy="180" r="3.5" fill="#F6C177"/>
  <text class="d dnow" x="640" y="158" text-anchor="middle">Now</text>
  <text class="t" x="640" y="214" text-anchor="middle">Final year</text>
  <text class="s" x="640" y="232" text-anchor="middle">+ internship</text></g>
<g class="node future" style="animation-delay:1.82s">
  
  <circle cx="750" cy="180" r="9" fill="#130C11" stroke="#6B4A58" stroke-width="3" stroke-dasharray="3 3"/>
  
  <text class="d" x="750" y="158" text-anchor="middle">2027</text>
  <text class="t" x="750" y="214" text-anchor="middle">EFZ diploma</text>
  <text class="s" x="750" y="232" text-anchor="middle">the goal</text></g>
</svg>